server.port=8081

# ===== 数据源：本地 MySQL（root / 123456） =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hooplab?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== JWT 配置 =====
jwt.secret=hooplab-jwt-secret-key-2026-please-change-in-prod
jwt.expiration=86400000

# ===== MyBatis-Plus 配置 =====
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
# 驼峰字段名映射到下划线列名（如 weekTrainCount -> week_train_count）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 开发期打印 SQL（生产可去掉）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
